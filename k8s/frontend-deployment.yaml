apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: dikuo/ecommerce-frontend:v1 # 🟢 Your newly pushed image
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_BACKEND_URL
          value: "http://localhost:8080" # 🟢 Points to your Backend Service LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000      # The port you'll use in your browser (localhost:3000)
      targetPort: 3000 # The port the Next.js container listens on
  type: LoadBalancer # 🟢 Makes the frontend accessible from your machine