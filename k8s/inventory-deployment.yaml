apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deployment
spec:
  replicas: 1 # We can scale this to 2 or 3 later!
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory-service
        image: dikuo/inventory-go:v1 # 🟢 The image you just pushed
        ports:
        - containerPort: 8080
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets # 🟢 Looking into the vault
              key: MONGODB_URI         # 🟢 Grabbing the specific key
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service # 🟢 This acts as a permanent "Internal URL"
spec:
  selector:
    app: inventory
  ports:
    - protocol: TCP
      port: 8080      # The port other pods will use
      targetPort: 8080 # The port inside the Go container
  type: ClusterIP # "Internal Only" - we don't want the world hitting the DB directly