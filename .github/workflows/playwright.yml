name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend 

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        # Point cache to the frontend lockfile
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies
      run: npm install

    - name: Install Backend dependencies
      # We move up one level to reach the backend folder
      run: |
        cd ../backend
        npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Backend and Frontend
      env:
        # These MUST match the names you typed in the GitHub Settings page
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Add any others you uploaded (JWT_SECRET, etc.)
      run: |
        cd ../backend && npm start & 
        npm run dev & 
        npx wait-on http://localhost:4000 http://localhost:5173 --timeout 60000
        npx playwright test
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30