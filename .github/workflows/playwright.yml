name: Playwright Tests
on:
  push:
    branches: [ main, master ] # Added your current branch
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm' # Speeds up future runs

    # 🟢 STEP 1: Install EVERYTHING (Root + Frontend)
    # This works if you set up "workspaces" in your root package.json
    - name: Install dependencies
      run: npm install 

    # 🟢 STEP 2: Build the frontend
    - name: Build frontend
      env:
        # NOTE: Ensure this secret is added to GitHub Settings > Secrets > Actions
        NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      run: npm run build --prefix frontend

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30